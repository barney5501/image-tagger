<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image🖼tagger🔖</title>
  </head>
  <body>
    <header id="imageNameHeader"></header>
    {% block body %}
    
    
    <div id="imageholder">
      <!-- <img id="displayImage" data-image-name="{{ currentImage }}" data-images-path="{{ imagesPath }}" src="{{ imagesPath }}/{{ currentImage }}"></img> -->
      <img id="displayImage" data-image-name="{{ currentImage }}" data-images-path="{{ imagesPath }}" src="../static/images/image.png"></img>    
    </div>
    <hr style="width: 100%; position: fixed; bottom: 64vh;">
    <div id="interactives">
      
      <div id="imageControls">
        <span class="imageControl" id="controlPrevious"> < </span>
        <span class="imageControl" id="controlNext"> > </span>
      </div>
      
      <div id="tags">
        <!-- <span class="tag">reactions<button class="removeTag" onclick="removeTag(this)">x</button></span>
        <span class="tag">dogs<button class="removeTag" onclick="removeTag(this)">x</button></span>
        <span class="tag">foodaroundtheworld<button class="removeTag" onclick="removeTag(this)">x</button></span>
        <span class="tag">cute<button class="removeTag" onclick="removeTag(this)">x</button></span>
        <span class="tag">oreos<button class="removeTag" onclick="removeTag(this)">x</button></span> -->
      </div>

      <div id="add">
        <input id="newTagText" type="text" placeholder="add tags..." /><button id="addTagButton">+</button>
      </div>

    </div>
    {% endblock %}
    <br />
  </body>

</html>

<style>
  body{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    flex-direction: column;
    text-align: center;
  }
  #imageNameHeader {
    font-size: 24px;
  }
    img {
        width: 300px;
    }
    #interactives {
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: fixed;
      bottom: 52vh;
      left: 39%;
    }
    .imageControl {
      align-content: center;
      margin: 5px;
      height: min-content;
    }
    .imageControl:hover {
      cursor: pointer;
    }
    #tags {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(4, auto);
      margin-bottom: 20px;
      justify-content: center;
    }
    .tag{
      background-color: rgba(72, 177, 238, 0.296);
      border-radius: 18px;
      min-width: 46px;
      width: fit-content;
      font-size: 16px;
      color: black;
      padding: 3px;
      text-align: center;
      height: min-content;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      margin-top: 3px;
      margin-right: 16px !important;
    }
    .removeTag {
      font-size: 12px !important;
      padding: 0;
      color: rgb(255, 255, 255);
      padding: 0;
      background-color: rgba(20, 47, 62, 0.696);
      border-radius: 7px;
      border: none;
      width: 13px !important;
      height: 13px !important;
      align-self: flex-start;
    }
    .tag:hover{
      cursor: default;
    }
    .removeTag:hover {
      cursor: pointer;
    }
</style>

<script>

// Image
const displayImage = document.getElementById('displayImage');
const imagesPath = displayImage.dataset.imagesPath;
const imageNameHeader = document.getElementById('imageNameHeader');
imageNameHeader.innerText = displayImage.dataset.imageName;

// Tags
const tagsHolder = document.getElementById('tags');
const tagInput = document.getElementById('newTagText');

// Buttons
const next = document.getElementById('controlNext');
const prev = document.getElementById('controlPrevious');
const addTagButton = document.getElementById('addTagButton');

const update_image = (image_data) => {
  const image_name = image_data['image'];
  const image_tags = image_data['tags'];
  displayImage.src = `${imagesPath}/${image_name}`;
  imageNameHeader.innerText = image_name;
  update_tags(image_tags);
}

const createTag = (tagValue) => {
  let tag = document.createElement('span');
  tag.classList.add('tag');
  tag.innerText = tagValue;
  
  let removeTagBtn = document.createElement('button');
  removeTagBtn.classList.add('removeTag');
  removeTagBtn.innerText = 'x';
  removeTagBtn.onclick = e => e.target.parentNode.remove();
  tag.appendChild(removeTagBtn);
  
  return tag;
}

const update_tags = (tags) => {
  tagsHolder.innerHTML = '';
  tags.forEach(tagValue => {
    let tag = createTag(tagValue);
    tagsHolder.appendChild(tag);
  });
}

const navigateImages = (direction) => {
  fetch(`/${direction}Image`)
    .then(res => {
      if(res.status == 204){
        return null;
      }
      return res.json();
    })
    .then(data => {
      if(data){
        update_image(data)
      }
    })
}

next.onclick = () => {navigateImages('next')};
prev.onclick = () => {navigateImages('prev')};

// add tag to image
addTagButton.onclick = () => {
  const image = displayImage.dataset.imageName;
  const addtagheaders = new Headers();
  addtagheaders.append("Content-Type", "application/json");
  const raw = JSON.stringify([tagInput.value]);
  const requestoptions = {
    method: "POST",
    headers: addtagheaders,
    body: raw,
    redirect: "follow"
  };
  fetch(`/image/${image}/tags`, requestoptions)
  .then(
    (response)=>response.text()
  )
  .then(
    (result)=>{
      let newtag = createTag(tagInput.value);
      tagsHolder.appendChild(newtag);
    }
  )
  .catch(
    (error)=>console.error(error)
  );
}
</script>
